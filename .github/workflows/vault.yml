# Meme Vault helper: when GIFs or memes are uploaded (or deleted), compress them, make previews,
# update the vault list and push the result. Netlify then publishes it.
name: Meme Vault

on:
  push:
    branches: [main]
    paths:
      - "site/memes/gifs/**"
      - "site/memes/images/**"
      - "site/memes/vault.json"
      - "tools/vault.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meme-vault
  cancel-in-progress: false

jobs:
  vault:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gifsicle ffmpeg > /dev/null
          pip install --quiet pillow
      - name: Process uploads
        run: python3 tools/vault.py
      - name: Save the result
        run: |
          git add -A site
          if git diff --cached --quiet; then echo "Nothing to update"; exit 0; fi
          git config user.name "KULT vault bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Meme Vault: process uploads"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1
